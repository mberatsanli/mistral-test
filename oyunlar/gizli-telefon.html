<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Gizli Telefon 📞</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(circle at center, #1a1a2e 0%, #0a0a14 100%);
    font-family: 'Segoe UI', Arial, sans-serif;
    color: #e8e8e8; gap: 12px;
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  h1 { font-size: 26px; color: #fbbf24; text-shadow: 0 0 12px #fbbf2466; }
  #hud { display: flex; gap: 24px; font-size: 17px; align-items: center; flex-wrap: wrap; justify-content: center; }
  #hud b { color: #4ade80; }
  #status { font-weight: bold; min-width: 240px; text-align: center; }
  .safe { color: #4ade80; }
  .warn { color: #fbbf24; }
  .danger { color: #ef4444; animation: blink .35s infinite alternate; }
  @keyframes blink { from { opacity: 1; } to { opacity: .35; } }
  #wrap { position: relative; }
  canvas {
    background: #000; border: 3px solid #fbbf24; border-radius: 8px;
    box-shadow: 0 0 30px #fbbf2033;
    image-rendering: pixelated;
    width: min(92vw, 720px); height: auto; display: block;
  }
  #overlay {
    position: absolute; inset: 0; display: none;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; background: #000000d9; border-radius: 8px;
    text-align: center; padding: 20px;
  }
  #overlay h2 { color: #ef4444; font-size: 30px; }
  .hint { font-size: 13px; color: #9ca3af; text-align: center; padding: 0 12px; }
</style>
</head>
<body>
  <h1>📞 Gizli Telefon</h1>
  <div id="hud">
    <span>Skor: <b id="score">0</b></span>
    <span>Rekor: <b id="best">0</b></span>
    <span id="status" class="safe"></span>
  </div>
  <div id="wrap">
    <canvas id="game" width="480" height="320"></canvas>
    <div id="overlay">
      <h2>😱 YAKALANDIN!</h2>
      <p id="finalScore"></p>
      <p>Yeniden başlamak için <b>Boşluk</b> / <b>Enter</b> veya ekrana dokun.</p>
    </div>
  </div>
  <p class="hint"><b>Boşluk'a basılı tut = saklan 🤫</b> · Bırak = konuş ve sigara iç 🚬 skor kazan ·<br>Kız arkadaş döndüğünde saklanmazsan yakalanırsın!</p>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const statusEl = document.getElementById('status');
const overlay = document.getElementById('overlay');
const finalScoreEl = document.getElementById('finalScore');

let hiding = false, alive = true, score = 0, best = 0;
let girlState = 'away', stateTime = 0, awayDur = 2, warnDur = 0.8, lookDur = 1.5;
let smoke = [], smokeAcc = 0;
let actx = null;

const rand = (a, b) => a + Math.random() * (b - a);

best = Number(localStorage.getItem('telefonBest') || 0);
bestEl.textContent = best;

function ensureAudio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
}
function beep(freq, dur, type = 'square', vol = 0.06, when = 0) {
  if (!actx) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, actx.currentTime + when);
  g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + when + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(actx.currentTime + when); o.stop(actx.currentTime + when + dur);
}

function setStatus(text, cls) {
  statusEl.textContent = text;
  statusEl.className = cls;
}

function reset() {
  hiding = false; alive = true; score = 0; smoke = []; smokeAcc = 0;
  girlState = 'away'; stateTime = 0;
  awayDur = rand(2.2, 4);
  scoreEl.textContent = 0;
  overlay.style.display = 'none';
  setStatus('Kız arkadaş uzakta... konuş! 📞', 'safe');
}

function caught() {
  alive = false;
  girlState = 'caught';
  beep(660, 0.15, 'sawtooth', 0.08, 0);
  beep(440, 0.15, 'sawtooth', 0.08, 0.15);
  beep(220, 0.35, 'sawtooth', 0.08, 0.3);
  if (score > best) {
    best = Math.floor(score);
    localStorage.setItem('telefonBest', best);
    bestEl.textContent = best;
  }
  setStatus('Yakalandın! 😱', 'danger');
  setTimeout(() => {
    finalScoreEl.textContent = 'Konuşma süren: ' + Math.floor(score) + ' sn';
    overlay.style.display = 'flex';
  }, 600);
}

function update(dt) {
  if (!alive) return;
  stateTime += dt;
  const level = Math.floor(score / 150);

  if (girlState === 'away') {
    if (stateTime > awayDur) {
      girlState = 'warn'; stateTime = 0;
      warnDur = Math.max(0.9 - level * 0.06, 0.35);
      beep(1046, 0.12);
      setStatus('DİKKAT! Dönmek üzere... ⚠️', 'warn');
    }
  } else if (girlState === 'warn') {
    if (stateTime > warnDur) {
      girlState = 'look'; stateTime = 0;
      lookDur = Math.min(rand(1.2, 2.2) + level * 0.12, 3.2);
      setStatus('SAKLAN! 🤫', 'danger');
    }
  } else if (girlState === 'look') {
    if (!hiding) { caught(); return; }
    if (stateTime > lookDur) {
      girlState = 'away'; stateTime = 0;
      awayDur = Math.max(rand(2.2, 4) - level * 0.15, 1.0);
      setStatus('Kız arkadaş uzakta... konuş! 📞', 'safe');
    }
  }

  if (!hiding && girlState !== 'look') {
    score += dt * 10;
    scoreEl.textContent = Math.floor(score);
    smokeAcc += dt;
    if (smokeAcc > 0.12) {
      smokeAcc = 0;
      smoke.push({ x: 60 + rand(-2, 2), y: 186, life: 1 });
      if (smoke.length > 40) smoke.shift();
    }
  }

  for (let i = smoke.length - 1; i >= 0; i--) {
    smoke[i].y -= 22 * dt;
    smoke[i].life -= dt * 0.7;
    if (smoke[i].life <= 0) smoke.splice(i, 1);
  }
}

function drawRoom() {
  ctx.fillStyle = '#232946'; ctx.fillRect(0, 0, W, 220);
  ctx.fillStyle = '#6b4f3a'; ctx.fillRect(0, 220, W, H - 220);
  ctx.fillStyle = '#5d4433';
  for (let x = 0; x < W; x += 40) ctx.fillRect(x, 220, 2, H - 220);
  ctx.fillStyle = '#0f3460'; ctx.fillRect(330, 28, 110, 84);
  ctx.fillStyle = '#0b1026'; ctx.fillRect(336, 34, 98, 72);
  ctx.fillStyle = '#ffffff';
  [[350, 50], [370, 70], [400, 45], [420, 80], [355, 90], [410, 60]].forEach(([x, y]) => ctx.fillRect(x, y, 2, 2));
  ctx.fillStyle = '#fde68a'; ctx.fillRect(408, 40, 16, 16);
  ctx.fillStyle = '#0b1026'; ctx.fillRect(413, 43, 14, 14);
  ctx.fillStyle = '#8b5a2b'; ctx.fillRect(36, 36, 56, 44);
  ctx.fillStyle = '#f472b6'; ctx.fillRect(42, 42, 44, 32);
  ctx.fillStyle = '#8b5a2b'; ctx.fillRect(396, 84, 64, 136);
  ctx.fillStyle = '#a06a35'; ctx.fillRect(402, 90, 52, 130);
  ctx.fillStyle = '#fbbf24'; ctx.fillRect(408, 150, 6, 6);
  ctx.fillStyle = '#7f5539'; ctx.fillRect(150, 240, 180, 60);
  ctx.fillStyle = '#a06a35'; ctx.fillRect(158, 248, 164, 44);
  ctx.fillStyle = '#b45309'; ctx.fillRect(196, 196, 28, 24);
  ctx.fillStyle = '#22c55e';
  ctx.fillRect(200, 172, 6, 26); ctx.fillRect(210, 164, 6, 34);
  ctx.fillRect(218, 176, 6, 22); ctx.fillRect(204, 168, 16, 6);
}

function drawMan() {
  const mx = 70, my = 158;
  ctx.fillStyle = '#38bdf8'; ctx.fillRect(mx, my + 24, 24, 30);
  ctx.fillStyle = '#f2c89b'; ctx.fillRect(mx + 4, my, 16, 20);
  ctx.fillStyle = '#3b2f2f'; ctx.fillRect(mx + 4, my, 16, 6); ctx.fillRect(mx + 4, my + 6, 3, 6);
  ctx.fillStyle = '#1e293b'; ctx.fillRect(mx + 8, my + 10, 3, 3); ctx.fillRect(mx + 15, my + 10, 3, 3);
  ctx.fillStyle = '#38bdf8'; ctx.fillRect(mx + 16, my + 26, 9, 5);
  ctx.fillStyle = '#111827'; ctx.fillRect(mx + 20, my + 8, 6, 10);
  ctx.fillStyle = '#f8fafc'; ctx.fillRect(mx - 6, my + 30, 6, 2);
  ctx.fillStyle = '#f97316'; ctx.fillRect(mx - 8, my + 30, 3, 2);
}

function drawGirl(gx, mode) {
  const gy = 150;
  ctx.fillStyle = '#f59e0b';
  ctx.fillRect(gx + 3, gy, 20, 10);
  ctx.fillRect(gx + 3, gy + 8, 4, 30);
  ctx.fillRect(gx + 19, gy + 8, 4, 30);
  ctx.fillStyle = '#f2c89b'; ctx.fillRect(gx + 7, gy + 6, 12, 14);
  ctx.fillStyle = '#1e293b';
  ctx.fillRect(gx + 9, gy + 11, 3, 3); ctx.fillRect(gx + 16, gy + 11, 3, 3);
  if (mode === 'look' || mode === 'caught') {
    ctx.fillRect(gx + 8, gy + 8, 5, 2);
    ctx.fillRect(gx + 15, gy + 8, 5, 2);
  }
  ctx.fillStyle = mode === 'caught' ? '#b91c1c' : '#7c2d12';
  ctx.fillRect(gx + 11, gy + 17, 6, 2);
  ctx.fillStyle = '#ec4899';
  ctx.fillRect(gx + 4, gy + 20, 18, 30);
  ctx.fillRect(gx + 2, gy + 44, 22, 8);
  ctx.fillStyle = '#f2c89b';
  ctx.fillRect(gx, gy + 24, 4, 16); ctx.fillRect(gx + 22, gy + 24, 4, 16);
  ctx.fillRect(gx + 8, gy + 52, 4, 14); ctx.fillRect(gx + 14, gy + 52, 4, 14);
  ctx.fillStyle = '#111827';
  ctx.fillRect(gx + 7, gy + 64, 6, 4); ctx.fillRect(gx + 13, gy + 64, 6, 4);
  if (mode === 'warn') {
    ctx.fillStyle = '#fbbf24'; ctx.font = 'bold 26px sans-serif';
    ctx.fillText('!', gx + 8, gy - 8);
  } else if (mode === 'look' || mode === 'caught') {
    ctx.font = '22px sans-serif';
    ctx.fillText(mode === 'caught' ? '😠' : '👀', gx + 1, gy - 8);
  }
}

function draw() {
  drawRoom();
  ctx.fillStyle = '#a0432f'; ctx.fillRect(36, 168, 140, 60);
  if (hiding && alive) {
    ctx.font = '22px sans-serif'; ctx.fillText('🤫', 95, 162);
  } else {
    drawMan();
    if (!alive) { ctx.font = '22px sans-serif'; ctx.fillText('😱', 82, 142); }
  }
  ctx.fillStyle = '#b5533c'; ctx.fillRect(28, 212, 156, 38);
  ctx.fillStyle = '#a0432f'; ctx.fillRect(28, 190, 16, 60); ctx.fillRect(168, 190, 16, 60);
  ctx.fillStyle = '#8f3a29'; ctx.fillRect(36, 212, 140, 4);

  if (girlState === 'warn') drawGirl(404, 'warn');
  else if (girlState === 'look' || girlState === 'caught') drawGirl(310, girlState);

  smoke.forEach(p => {
    ctx.fillStyle = 'rgba(200,200,200,' + (p.life * 0.6).toFixed(2) + ')';
    ctx.fillRect(p.x, p.y, 3, 3);
  });

  if (girlState === 'look') {
    ctx.strokeStyle = 'rgba(239,68,68,' + (0.4 + 0.3 * Math.abs(Math.sin(Date.now() / 120))) + ')';
    ctx.lineWidth = 5;
    ctx.strokeRect(3, 3, W - 6, H - 6);
  }
}

function press() {
  ensureAudio();
  if (!alive) { reset(); return; }
  hiding = true;
}
function release() { hiding = false; }

document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === ' ' || k === 'enter') { e.preventDefault(); if (!e.repeat) press(); }
});
document.addEventListener('keyup', e => {
  if (e.key.toLowerCase() === ' ') release();
});
canvas.addEventListener('touchstart', e => { e.preventDefault(); press(); }, { passive: false });
document.addEventListener('touchend', release);
canvas.addEventListener('mousedown', press);
document.addEventListener('mouseup', release);
canvas.addEventListener('contextmenu', e => e.preventDefault());

let last = 0;
function loop(t) {
  const dt = Math.min((t - last) / 1000, 0.05);
  last = t;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

reset();
requestAnimationFrame(loop);
</script>
</body>
</html>
